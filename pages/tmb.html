<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <title>FitLife | TMB</title>
  </head>
  <body>
    <nav>
      <a href="../index.html" class="logo">
        <i class="fas fa-heartbeat"></i>
        <p>FitLife</p>
      </a>

      <ul class="nav-links">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="imc.html" class="nav-link">IMC</a></li>
        <li><a href="tmb.html" class="nav-link active">TMB</a></li>
        <li><a href="water.html" class="nav-link">Água</a></li>
      </ul>
    </nav>

    <main>
      <section class="tool-container">
        <header>
          <h2><i class="fas fa-fire"></i> Taxa Metabólica</h2>
        </header>
        <form>
          <div class="form-group">
            <label for="gender">Sexo</label>
            <select id="gender">
              <option value="male">Masculino</option>
              <option value="female">Feminino</option>
            </select>
          </div>

          <div class="form-group">
            <label for="weight">Peso (kg)</label>
            <input type="number" id="weight" placeholder="Ex: 70" required />
          </div>

          <div class="form-group">
            <label for="height">Altura (cm)</label>
            <input type="number" id="height" placeholder="Ex: 175" required />
          </div>

          <div class="form-group">
            <label for="age">Idade (anos)</label>
            <input type="number" id="age" placeholder="Ex: 25" required />
          </div>

          <button
            type="submit"
            class="action-btn"
            onclick="calculateTMB(event)"
          >
            Calcular Calorias
          </button>
          <a href="../index.html" class="action-btn btn-back">Voltar</a>
        </form>

        <div id="result" class="result-box">
          <p>Gasto Calórico Basal:</p>
          <h1 id="tmb-value" class="text-primary">0000</h1>
          <p>Kcal/dia (Repouso)</p>
        </div>
      </section>
    </main>

    <script src="../js/tmb.js"></script>
  </body>
</html>
