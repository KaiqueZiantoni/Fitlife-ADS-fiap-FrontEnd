<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <title>FitLife | IMC</title>
  </head>
  <body>
    <nav>
      <a href="../index.html" class="logo">
        <i class="fas fa-heartbeat"></i>
        <p>FitLife</p>
      </a>

      <ul class="nav-links">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="imc.html" class="nav-link active">IMC</a></li>
        <li><a href="tmb.html" class="nav-link">TMB</a></li>
        <li><a href="water.html" class="nav-link">Água</a></li>
      </ul>
    </nav>

    <main>
      <section class="tool-container">
        <header>
          <h2><i class="fas fa-weight"></i> Cálculo de IMC</h2>
        </header>

        <form>
          <div class="form-group">
            <label for="weight">Peso (kg)</label>
            <input type="number" id="weight" placeholder="Ex: 70" step="0.1" />
          </div>
          <div class="form-group">
            <label for="height">Altura (m)</label>
            <input
              type="number"
              id="height"
              placeholder="Ex: 1.75"
              step="0.01"
            />
          </div>

          <button
            type="submit"
            class="action-btn"
            onclick="calculateIMC(event)"
          >
            Calcular
          </button>
          <a href="../index.html" class="action-btn btn-back">Voltar</a>
        </form>

        <div id="result" class="result-box">
          <p>Seu IMC é:</p>
          <h1 id="imc-value">00.0</h1>
          <p id="imc-desc">Normal</p>
        </div>
      </section>
    </main>

    <script src="../js/imc.js"></script>
  </body>
</html>
